# Zicro CI. Every job FAILS when its component does not build or its tests fail —
# nothing here is allowed to "pass" by skipping. Jobs that need something a stock
# runner lacks (the Z checkout, an Android NDK, KVM) are separate, and say so.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.0

jobs:
  # The core gate: format, unit tests, every native artifact, both portable targets,
  # and the benchmark binary (built AND run in --quick mode: `zig build bench` once
  # silently stopped compiling and nobody noticed — the 0.17 port's `**`).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System libraries (desktop Linux feature set, build.zig `Features`)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev wayland-protocols libasound2-dev \
            libharfbuzz-dev libpipewire-0.3-dev
      - name: Format
        run: zig fmt --check build.zig src bench examples
      - name: Unit tests
        run: zig build test --summary all
      - name: Native build (library + examples)
        run: zig build install
      - name: Android compile-check
        run: zig build android
      - name: Web (wasm32)
        run: zig build web
      - name: Benchmark (quick)
        run: zig build bench -- --quick

  # The Z-Scenic backend (window_z.zig, scenic_window.zig, scenic_client.zig) is
  # compiled by NO other step — only Z's build pulls it in. check-z runs its host
  # tests over Z's REAL protocol.zig and compiles shell_z for Z's userspace target
  # with Z's real rt.zig. It needs the Z repository; without access the job fails
  # (it must not turn green by skipping).
  check-z:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: postadelmaga/Z
          path: Z
          # Z may be private: grant a token with read access as Z_READ_TOKEN.
          token: ${{ secrets.Z_READ_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System libraries (the host tests link text_c with HarfBuzz)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Z backend — host tests + shell_z for Z userspace
        run: zig build check-z -Dz-src="$GITHUB_WORKSPACE/Z" --summary all

  # The real session: Zicro's shell on Z's zicro_host under QEMU/KVM, scripted input
  # (KTESTs zicro_session_*). Needs KVM and the Z tree: manual, or a self-hosted
  # runner with /dev/kvm. A boot that does not print every gate as PASS fails.
  z-session:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: Zicro
      - uses: actions/checkout@v4
        with:
          repository: postadelmaga/Z
          path: Z
          token: ${{ secrets.Z_READ_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          sudo chmod 666 /dev/kvm
      - name: Boot the zicro-only lane
        working-directory: Z
        run: |
          zig build run-x86_64-kvm -Dzicro-src="$GITHUB_WORKSPACE/Zicro" -Dzart-src= -Dzicro-only -j2 2>&1 | tee boot.log
          ../Zicro/scripts/check-z-session.sh boot.log
